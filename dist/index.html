<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <script type="module" crossorigin src="/assets/index-BFl7EzvZ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D5F97-2w.css">
</head>

<body>
  <main class="wrapper">
    <h1>Countdown timer</h1>

    <div class="timer">

      <div class="unit">
        <div class="card" id="hours">00</div>
        <span class="label">Hours</span>
      </div>
      <div class="sep"><i></i><i></i></div>

      <div class="unit">
        <div class="card" id="minutes">00</div>
        <span class="label">Minutes</span>
      </div>
      <div class="sep"><i></i><i></i></div>

      <div class="unit">
        <div class="card" id="seconds">00</div>
        <span class="label">Seconds</span>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn primary">Start</button>
      <button id="stopBtn" class="btn" disabled>Stop</button>
      <button id="resetBtn" class="btn">Reset</button>
    </div>
  </main>
</body>

</html>
